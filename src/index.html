<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Alrededor de los EE.UU.</title>
    <link rel="stylesheet" href="page/index.css" />
    <link rel="stylesheet" href="./fonts/Inter.ttc" />
  </head>
  <body class="page">
    <!-- Header -->
    <header class="header">
      <h1 class="header__title">
        Around<span class="header__subtitle">The U.S.</span>
      </h1>
    </header>

    <!-- Profile -->
    <section class="profile">
      <div class="profile__avatar-container">
        <img src="./images/Avatar.png" alt="Avatar" class="profile__avatar" />
        <button
          class="profile__avatar-edit-button"
          type="button"
          aria-label="Editar foto de perfil"
        ></button>
      </div>

      <div class="profile__info">
        <h1 class="profile__name">
          Jacques Cousteau
          <button
            class="profile__edit-button"
            type="button"
            aria-label="Editar perfil"
          ></button>
        </h1>
        <p class="profile__occupation">Explorador</p>
      </div>
      <button
        class="profile__add-button"
        type="button"
        aria-label="Agregar nuevo lugar"
        data-open="add-card"
      ></button>
    </section>

    <!-- Cards -->
    <section class="cards" aria-live="polite"></section>

    <!--Templates -->
    <template id="card-template">
      <article class="card">
        <img class="card__image" src="" alt="" />
        <button
          class="card__delete-button"
          type="button"
          aria-label="Eliminar tarjeta"
        ></button>
        <div class="card__caption">
          <h3 class="card__title block"></h3>
          <button
            class="card__like-button"
            type="button"
            aria-label="Marcar como favorito"
          ></button>
        </div>
      </article>
    </template>

    <!-- Popups -->

    <!-- Popup: Editar perfil -->
    <section class="popup popup_type_edit-profile" aria-hidden="true">
      <div class="popup__container">
        <button
          class="popup__close-button"
          type="button"
          aria-label="Cerrar"
          data-close
        ></button>
        <h3 class="popup__title">Editar perfil</h3>
        <form class="popup__form" name="edit-profile" novalidate>
          <input
            type="text"
            name="name"
            class="popup__input"
            placeholder="Nombre"
            required
            minlength="2"
            maxlength="40"
          />
          <span class="popup__error name-error"></span>

          <input
            type="text"
            name="about"
            class="popup__input"
            placeholder="Acerca de mí"
            required
            minlength="2"
            maxlength="200"
          />
          <span class="popup__error about-error"></span>

          <button class="popup__save-button" type="submit" disabled>
            Guardar
          </button>
        </form>
      </div>
    </section>

    <!-- Popup: Nuevo lugar -->
    <section class="popup popup_type_add-card" aria-hidden="true">
      <div class="popup__container">
        <button
          class="popup__close-button"
          type="button"
          aria-label="Cerrar"
          data-close
        ></button>
        <h3 class="popup__title">Nuevo lugar</h3>
        <form class="popup__form" name="add-card" novalidate>
          <input
            type="text"
            name="title"
            class="popup__input"
            placeholder="Título"
            required
            minlength="1"
            maxlength="30"
          />
          <span class="popup__error title-error"></span>

          <input
            type="url"
            name="link"
            class="popup__input"
            placeholder="Enlace a la imagen"
            required
          />
          <span class="popup__error link-error"></span>

          <button class="popup__save-button" type="submit" disabled>
            Crear
          </button>
        </form>
      </div>
    </section>

    <!-- Popup: Actualizar foto de perfil -->
    <section class="popup popup_type_edit-avatar" aria-hidden="true">
      <div class="popup__container">
        <button
          class="popup__close-button"
          type="button"
          aria-label="Cerrar"
          data-close
        ></button>
        <h3 class="popup__title">Cambiar foto de perfil</h3>
        <form class="popup__form" name="edit-avatar" novalidate>
          <input
            type="url"
            name="avatar"
            class="popup__input"
            placeholder="Enlace a la nueva foto"
            required
          />
          <span class="popup__error avatar-error"></span>

          <button class="popup__save-button" type="submit" disabled>
            Guardar
          </button>
        </form>
      </div>
    </section>

    <!-- Popup: Confirmar eliminación -->
    <section class="popup popup_type_confirm-delete" aria-hidden="true">
      <div class="popup__container">
        <button
          class="popup__close-button"
          type="button"
          aria-label="Cerrar"
          data-close
        ></button>
        <h3 class="popup__title">¿Estás seguro/a?</h3>

        <form class="popup__form" name="confirm-delete">
          <button class="popup__save-button" type="submit">Sí</button>
        </form>
      </div>
    </section>

    <!-- Popup: Imagen ampliada -->
    <section class="popup popup_type_image" aria-hidden="true">
      <div class="popup__container popup__container_type_image">
        <button
          class="popup__close-button"
          type="button"
          aria-label="Cerrar"
          data-close
        ></button>
        <figure class="popup__figure">
          <img class="popup__image" src="" alt="" />
          <figcaption class="popup__caption"></figcaption>
        </figure>
      </div>
    </section>

    <!-- Footer -->
    <footer class="footer">
      <p class="footer__text">&copy; 2024 Around The U.S.</p>
    </footer>

    <!-- JS -->
    <script type="module" src="page/index.js"></script>
  </body>
</html>
